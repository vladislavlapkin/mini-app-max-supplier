# Продакшен-оверлей: HTTPS-прокси Caddy перед приложением.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Нужны переменная DOMAINS в .env и открытые порты 80 и 443.
services:
  caddy:
    image: caddy:2-alpine
    environment:
      DOMAINS: ${DOMAINS:?Укажите DOMAINS в .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
